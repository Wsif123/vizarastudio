const { useState, useEffect, useRef } = React;

// ==========================================
// 1. TYPEWRITER CUSTOM HOOK
// ==========================================
function useTypewriter(text, speed = 38, startDelay = 600) {
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);

  useEffect(() => {
    setDisplayed('');
    setDone(false);
    
    const delayTimer = setTimeout(() => {
      let index = 0;
      const intervalTimer = setInterval(() => {
        index++;
        if (index <= text.length) {
          setDisplayed(text.slice(0, index));
        } else {
          setDone(true);
          clearInterval(intervalTimer);
        }
      }, speed);
      
      return () => clearInterval(intervalTimer);
    }, startDelay);

    return () => clearTimeout(delayTimer);
  }, [text, speed, startDelay]);

  return { displayed, done };
}

// 3. TILT PORTFOLIO CARD COMPONENT
// ==========================================
const PortfolioCard = ({ img, brand, type, tag, video }) => {
  const cardRef = useRef(null);
  const videoRef = useRef(null);
  const [tilt, setTilt] = useState({ x: 0, y: 0 });
  const [sheen, setSheen] = useState({ x: 0, y: 0, active: false });

  useEffect(() => {
    if (videoRef.current) {
      videoRef.current.play().catch(() => {});
    }
  }, []);

  const handleMouseMove = (e) => {
    const card = cardRef.current;
    if (!card) return;
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left - (rect.width / 2);
    const y = e.clientY - rect.top - (rect.height / 2);
    const px = x / (rect.width / 2);
    const py = y / (rect.height / 2);
    setTilt({ x: px * 8, y: -py * 8 });
    setSheen({ x: e.clientX - rect.left, y: e.clientY - rect.top, active: true });
  };

  const handleMouseLeave = () => {
    setTilt({ x: 0, y: 0 });
    setSheen(prev => ({ ...prev, active: false }));
  };

  return (
    <div 
      ref={cardRef}
      onMouseMove={handleMouseMove}
      onMouseLeave={handleMouseLeave}
      style={{
        transform: `perspective(1000px) rotateY(${tilt.x}deg) rotateX(${tilt.y}deg) translateY(${tilt.x !== 0 ? '-6px' : '0px'})`,
        transition: 'transform 0.15s ease-out, box-shadow 0.3s ease',

        backgroundColor: 'var(--card-bg)'

          }}
          className="absolute inset-0 pointer-events-none z-10"
        />

      </div>
    </div>
  );
};

// ==========================================
// 4. PARTICLE FIELD COMPONENT
// ==========================================
const ParticleField = () => {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animId;
    let mouse = { x: -2000, y: -2000 };
    const COUNT = 35;
    const particles = [];

    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener('resize', resize);

    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        w: 14 + Math.random() * 6,
        h: 14 + Math.random() * 6,
        baseX: Math.random() * canvas.width,
        baseY: Math.random() * canvas.height,
        driftSpeed: 0.002 + Math.random() * 0.006,
        hue: Math.random() * 360,
        sat: 60 + Math.random() * 30,
        light: 45 + Math.random() * 25,
        alpha: 0.5 + Math.random() * 0.3,
      });
    }

    const animate = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p) => {
        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 250) {
          const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.4;
          const force = ((250 - dist) / 250) * 0.8;
          p.x += Math.cos(angle) * force;
          p.y += Math.sin(angle) * force;
        } else {
          p.x += (p.baseX - p.x) * p.driftSpeed;
          p.y += (p.baseY - p.y) * p.driftSpeed;
          if (Math.abs(p.x - p.baseX) < 2 && Math.abs(p.y - p.baseY) < 2) {
            p.baseX = 50 + Math.random() * (canvas.width - 100);
            p.baseY = 50 + Math.random() * (canvas.height - 100);
          }
        }

        p.x = Math.max(0, Math.min(canvas.width, p.x));
        p.y = Math.max(0, Math.min(canvas.height, p.y));

        ctx.save();
        ctx.translate(p.x, p.y);

        const inset = 1;
        ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${p.alpha})`;
        ctx.fillRect(-p.w / 2 + inset, -p.h / 2 + inset, p.w - inset * 2, p.h - inset * 2);

        ctx.fillStyle = `hsla(${p.hue + 20}, ${p.sat + 10}%, ${p.light + 15}%, ${p.alpha * 0.6})`;
        ctx.fillRect(-p.w / 2 + inset + 1, -p.h / 2 + 1, 1, 1);
        ctx.fillRect(-p.w / 2 + 1, -p.h / 2 + inset + 1, 1, 1);

        ctx.restore();
      });

      animId = requestAnimationFrame(animate);
    };

    const handleMouseMove = (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    };
    window.addEventListener('mousemove', handleMouseMove);

    animate();

    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', handleMouseMove);
    };
  }, []);

  return (
    <canvas
      ref={canvasRef}
      className="fixed inset-0 z-[1] pointer-events-none"
    />
  );
};
