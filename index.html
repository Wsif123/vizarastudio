const { useState, useEffect, useRef } = React;

// ==========================================
// 1. TYPEWRITER CUSTOM HOOK
// ==========================================
function useTypewriter(text, speed = 38, startDelay = 600) {
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);

  useEffect(() => {
    setDisplayed('');
    setDone(false);
    
    const delayTimer = setTimeout(() => {
      let index = 0;
      const intervalTimer = setInterval(() => {
        index++;
        if (index <= text.length) {
          setDisplayed(text.slice(0, index));
        } else {
          setDone(true);
          clearInterval(intervalTimer);
        }
      }, speed);
      
      return () => clearInterval(intervalTimer);
    }, startDelay);

    return () => clearTimeout(delayTimer);
  }, [text, speed, startDelay]);

  return { displayed, done };
}

// 3. TILT PORTFOLIO CARD COMPONENT
// ==========================================
const PortfolioCard = ({ img, brand, type, tag }) => {
  const cardRef = useRef(null);
  const [tilt, setTilt] = useState({ x: 0, y: 0 });
  const [sheen, setSheen] = useState({ x: 0, y: 0, active: false });

  const handleMouseMove = (e) => {
    const card = cardRef.current;
    if (!card) return;
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left - (rect.width / 2);
    const y = e.clientY - rect.top - (rect.height / 2);
    const px = x / (rect.width / 2);
    const py = y / (rect.height / 2);
    setTilt({ x: px * 8, y: -py * 8 });
    setSheen({ x: e.clientX - rect.left, y: e.clientY - rect.top, active: true });
  };

  const handleMouseLeave = () => {
    setTilt({ x: 0, y: 0 });
    setSheen(prev => ({ ...prev, active: false }));
  };

  return (
    <div 
      ref={cardRef}
      onMouseMove={handleMouseMove}
      onMouseLeave={handleMouseLeave}
      style={{
        transform: `perspective(1000px) rotateY(${tilt.x}deg) rotateX(${tilt.y}deg) translateY(${tilt.x !== 0 ? '-6px' : '0px'})`,
        transition: 'transform 0.15s ease-out, box-shadow 0.3s ease'
      }}

// ==========================================
// 4. PARTICLE FIELD COMPONENT
// ==========================================
const ParticleField = () => {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animId;
    let mouse = { x: -2000, y: -2000 };
    const COUNT = 35;
    const particles = [];

    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener('resize', resize);

    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        w: 8 + Math.random() * 4,
        h: 8 + Math.random() * 4,
        baseX: Math.random() * canvas.width,
        baseY: Math.random() * canvas.height,
        driftSpeed: 0.002 + Math.random() * 0.006,
        hue: 100 + Math.random() * 40,
        sat: 25 + Math.random() * 20,
        light: 30 + Math.random() * 20,
        alpha: 0.2 + Math.random() * 0.3,
      });
    }

    const animate = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p) => {
        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 250) {
          const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.4;
          const force = ((250 - dist) / 250) * 0.8;
          p.x += Math.cos(angle) * force;
          p.y += Math.sin(angle) * force;
        } else {
          p.x += (p.baseX - p.x) * p.driftSpeed;
          p.y += (p.baseY - p.y) * p.driftSpeed;
          if (Math.abs(p.x - p.baseX) < 2 && Math.abs(p.y - p.baseY) < 2) {
            p.baseX = 50 + Math.random() * (canvas.width - 100);
            p.baseY = 50 + Math.random() * (canvas.height - 100);
          }
        }

        p.x = Math.max(0, Math.min(canvas.width, p.x));
        p.y = Math.max(0, Math.min(canvas.height, p.y));

        ctx.save();
        ctx.translate(p.x, p.y);

        const inset = 1;
        ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${p.alpha})`;
        ctx.fillRect(-p.w / 2 + inset, -p.h / 2 + inset, p.w - inset * 2, p.h - inset * 2);

        ctx.fillStyle = `hsla(${p.hue + 20}, ${p.sat + 10}%, ${p.light + 15}%, ${p.alpha * 0.6})`;
        ctx.fillRect(-p.w / 2 + inset + 1, -p.h / 2 + 1, 1, 1);
        ctx.fillRect(-p.w / 2 + 1, -p.h / 2 + inset + 1, 1, 1);

        ctx.restore();
      });

      animId = requestAnimationFrame(animate);
    };

    const handleMouseMove = (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    };
    window.addEventListener('mousemove', handleMouseMove);

    animate();

    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', handleMouseMove);
    };
  }, []);

  return (
    <canvas
      ref={canvasRef}
      className="fixed inset-0 z-[1] pointer-events-none"
    />
  );
};

      if (window.innerWidth < 1024) return;
      if (previousX.current === null) {
        previousX.current = e.clientX;
        return;
      }
      
      const delta = e.clientX - previousX.current;
      previousX.current = e.clientX;

      if (!video.duration) return;

      // Update Target Scrub Time based on mouse move speed and screen size
      const change = (delta / window.innerWidth) * 0.8 * video.duration;
      let targetTime = video.currentTime + change;
      targetTime = Math.max(0, Math.min(video.duration, targetTime));

      video.currentTime = targetTime;
    };

    const handleMouseEnter = () => {
      previousX.current = null;
    };

    const handleSeeked = () => {
      // Seeked callback to ensure smooth frame-by-frame rendering
    };

    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseenter', handleMouseEnter);
    video.addEventListener('seeked', handleSeeked);

    return () => {
      window.removeEventListener('mousemove', handleMouseMove);
      window.removeEventListener('mouseenter', handleMouseEnter);

          <span className="text-xs font-semibold tracking-widest text-brand-greenLight uppercase bg-brand-bannerBg border border-brand-borderLight py-1.5 px-4 rounded-full">
            The Orbital Process
          </span>
          <h2 className="text-4xl md:text-5xl font-semibold text-black tracking-tight mt-6">
            Simple for you. Powerful in output.
          </h2>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-12 bg-brand-bannerBg border border-brand-borderLight rounded-[36px] p-8 md:p-12">
          <div className="flex flex-col">
            <span className="text-5xl font-light text-brand-greenLight/60 mb-6 font-serif italic">01</span>
            <h3 className="text-xl font-medium text-black mb-3">Send your product details</h3>
            <p className="text-brand-desc text-sm leading-relaxed">
              Just upload a photo of your product. Any angle, any background quality. Our studio engines handles the rest.
            </p>
          </div>
          <div className="flex flex-col border-t md:border-t-0 md:border-l border-brand-borderLight pt-8 md:pt-0 md:pl-10">
            <span className="text-5xl font-light text-brand-greenLight/60 mb-6 font-serif italic">02</span>
            <h3 className="text-xl font-medium text-black mb-3">Orbital Rendering</h3>
            <p className="text-brand-desc text-sm leading-relaxed">
              Our designers dissect your brand DNA to build an ultra-premium, custom cinematic environment and lighting visualizer.
            </p>
          </div>
          <div className="flex flex-col border-t md:border-t-0 md:border-l border-brand-borderLight pt-8 md:pt-0 md:pl-10">
            <span className="text-5xl font-light text-brand-greenLight/60 mb-6 font-serif italic">03</span>
            <h3 className="text-xl font-medium text-black mb-3">Receive & Publish</h3>
            <p className="text-brand-desc text-sm leading-relaxed">
              Stunning 8K digital assets delivered in 24 hours. Optimized for Instagram, Amazon, Daraz, or high-definition print billboards.
            </p>
          </div>
        </div>
      </section>

      {/* PRICING SECTION */}
      <section id="pricing" className="relative z-10 bg-white border-t border-brand-borderLight py-24 px-6 sm:px-12 max-w-7xl mx-auto w-full">
        <div className="mb-12 text-center">
          <span className="text-xs font-semibold tracking-widest text-brand-greenLight uppercase bg-brand-bannerBg border border-brand-borderLight py-1.5 px-4 rounded-full">
            Acquisition Plans
          </span>
          <h2 className="text-4xl md:text-5xl font-semibold text-black tracking-tight mt-6">
            Agency quality. Not agency prices.
          </h2>
        </div>

        {/* Tab Switcher */}
        <div className="flex justify-center mb-12">
          <div className="inline-flex bg-brand-bannerBg border border-brand-borderLight rounded-full p-1">
            <button
              onClick={() => setActiveTab('video')}
              className={`px-8 py-3 rounded-full text-sm font-medium transition-all duration-200 ${
                activeTab === 'video'
                  ? 'bg-brand-green text-white shadow-md'
                  : 'text-brand-desc hover:text-black'
              }`}
            >
              Video Ads
            </button>
            <button
              onClick={() => setActiveTab('photo')}
              className={`px-8 py-3 rounded-full text-sm font-medium transition-all duration-200 ${
                activeTab === 'photo'
                  ? 'bg-brand-green text-white shadow-md'
                  : 'text-brand-desc hover:text-black'
              }`}
            >
              Product Photography
            </button>
          </div>
        </div>

        {/* Pricing Cards */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
          {(activeTab === 'video' ? videoPlans : photoPlans).map((plan, idx) => (
            <div
              key={plan.name}
              onMouseEnter={() => setHoveredCard(plan.name)}
              onMouseLeave={() => setHoveredCard(null)}
              className={`relative rounded-3xl p-8 flex flex-col justify-between transition-all duration-300 ${
                hoveredCard === plan.name
                  ? 'border-2 border-brand-greenLight bg-brand-bannerBg shadow-xl'
                  : 'border border-brand-borderLight bg-white'
              }`}
            >
              {plan.popular && (
                <span className="absolute top-6 right-6 text-[10px] font-bold tracking-wider text-brand-greenLight uppercase bg-brand-greenLight/10 border border-brand-greenLight/20 py-1 px-3 rounded-full">
                  Most Popular
                </span>
              )}
              <div>
                <span className="text-xs font-bold tracking-widest uppercase text-neutral-400">{plan.name}</span>
                <div className="text-4xl font-bold text-black mt-4 mb-2">
                  {plan.price}<span className="text-sm font-normal text-neutral-400"> {plan.unit}</span>
                </div>
                <p className="text-xs text-brand-desc mb-6">{plan.delivery} &middot; {plan.revisions}</p>
                <ul className="space-y-3 mb-8">
                  {plan.features.map((f, i) => (
                    <li key={i} className="text-sm text-neutral-700 flex items-start gap-2">
                      <div className="w-1.5 h-1.5 rounded-full bg-brand-greenLight mt-1.5 shrink-0" /> {f}
                    </li>
                  ))}
                </ul>
              </div>
              <button
                onClick={() => document.getElementById('contact-anchor').scrollIntoView({behavior:'smooth'})}
                className={`w-full py-4 rounded-full text-sm font-medium uppercase tracking-wider transition-all duration-200 ${
                  hoveredCard === plan.name
                    ? 'bg-brand-green text-white shadow-md hover:bg-neutral-800'
                    : 'border border-brand-borderLight text-black hover:border-neutral-400'
                }`}
              >
                {plan.cta}
              </button>
            </div>
          ))}
        </div>

        <p className="text-xs text-brand-desc text-center max-w-lg mx-auto">
          Additional revisions available as paid add-on. Rush delivery available on request.
        </p>
      </section>

      {/* CONTACT FORM SECTION */}
      <section id="contact-anchor" className="relative z-10 bg-white border-t border-brand-borderLight py-24 px-6 sm:px-12 max-w-4xl mx-auto w-full">
        <div className="bg-brand-bannerBg border border-brand-borderLight rounded-[36px] p-8 md:p-16 text-center">
          <h2 className="text-4xl font-semibold text-black tracking-tight mb-4">
            Ready to look <span className="italic font-serif text-brand-greenLight">expensive?</span>
          </h2>
          <p className="text-brand-desc text-sm max-w-md mx-auto mb-10">
            Submit your transmission below. We will render a free visual proof of your product — no contract required.
          </p>

          <form action="https://formspree.io/f/xykonbob" method="POST" className="flex flex-col gap-5 max-w-lg mx-auto">
            
            {/* hidden inputs for service pill integrations */}
            <input type="hidden" name="requested_services" value={selectedServices.join(', ')} />
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <input 
                type="text" 
                name="name" 
                placeholder="Your Name" 
                required 
                className="w-full bg-white border border-brand-borderLight rounded-full px-6 py-4 text-sm text-black outline-none focus:border-brand-greenLight transition-colors"
              />
              <input 
                type="text" 
                name="contact" 
                placeholder="Email or WhatsApp" 
                required 
                className="w-full bg-white border border-brand-borderLight rounded-full px-6 py-4 text-sm text-black outline-none focus:border-brand-greenLight transition-colors"
              />
            </div>
            
            <textarea 
              name="message" 
              placeholder="Describe your product, or highlight details about your query..." 
              required
              rows="4"
              className="w-full bg-white border border-brand-borderLight rounded-3xl px-6 py-4 text-sm text-black outline-none resize-none focus:border-brand-greenLight transition-colors"
            />
            
            <button 
              type="submit" 
              className="w-full py-4 rounded-full bg-brand-green text-white hover:bg-neutral-800 transition-colors font-medium text-sm uppercase tracking-wider shadow-md"
            >
              Initiate Uplink
            </button>
          </form>
        </div>
      </section>

      {/* FOOTER */}
      <footer className="relative z-10 bg-white border-t border-brand-borderLight py-12 px-6 sm:px-12 max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <span className="text-lg font-semibold tracking-tight text-black">Vizara Studio</span>
        <span className="text-xs text-neutral-400">&copy; 2026 Vizara Studio. All rights reserved. Created via Orbital Operations.</span>
      </footer>

    </div>
  );
}

// Render the application into #root
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script src="/chat-widget.js" data-api-url="https://vizara-support-agent.onrender.com/chat"></script>
