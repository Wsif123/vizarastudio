const { useState, useEffect, useRef, useCallback } = React;
const { motion, AnimatePresence } = window.Motion;

// ==========================================
// 1. TYPEWRITER CUSTOM HOOK
// ==========================================
function useTypewriter(text, speed = 38, startDelay = 600) {
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);

  useEffect(() => {
    setDisplayed('');
    setDone(false);
    
    const delayTimer = setTimeout(() => {
      let index = 0;
      const intervalTimer = setInterval(() => {
        index++;
        if (index <= text.length) {
          setDisplayed(text.slice(0, index));
        } else {
          setDone(true);
          clearInterval(intervalTimer);
        }
      }, speed);
      
      return () => clearInterval(intervalTimer);
    }, startDelay);

    return () => clearTimeout(delayTimer);
  }, [text, speed, startDelay]);

  return { displayed, done };
}

// ==========================================
// 3. TILT PORTFOLIO CARD COMPONENT
// ==========================================
const PortfolioCard = ({ img, brand, type, tag, video }) => {
  const cardRef = useRef(null);
  const videoRef = useRef(null);
  const [tilt, setTilt] = useState({ x: 0, y: 0 });
  const [sheen, setSheen] = useState({ x: 0, y: 0, active: false });

  useEffect(() => {
    if (videoRef.current) {
      videoRef.current.play().catch(() => {});
    }
  }, []);

  const handleMouseMove = (e) => {
    const card = cardRef.current;
    if (!card) return;
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left - (rect.width / 2);
    const y = e.clientY - rect.top - (rect.height / 2);
    const px = x / (rect.width / 2);
    const py = y / (rect.height / 2);
    setTilt({ x: px * 8, y: -py * 8 });
    setSheen({ x: e.clientX - rect.left, y: e.clientY - rect.top, active: true });
  };

  const handleMouseLeave = () => {
    setTilt({ x: 0, y: 0 });
    setSheen(prev => ({ ...prev, active: false }));
  };

  return (
    <div 
      ref={cardRef}
      onMouseMove={handleMouseMove}
      onMouseLeave={handleMouseLeave}
      style={{
        transform: `perspective(1000px) rotateY(${tilt.x}deg) rotateX(${tilt.y}deg) translateY(${tilt.x !== 0 ? '-6px' : '0px'})`,
        transition: 'transform 0.15s ease-out, box-shadow 0.3s ease',
        border: '1px solid var(--border-color)',
        backgroundColor: 'var(--card-bg)'
      }}
      className="relative overflow-hidden rounded-3xl p-4 hover:shadow-xl hover:border-brand-green/20"
    >
      {sheen.active && (
        <div 
          style={{
            background: `radial-gradient(circle at ${sheen.x}px ${sheen.y}px, rgba(77, 109, 71, 0.05) 0%, transparent 80%)`
          }}
          className="absolute inset-0 pointer-events-none z-10"
        />
      )}
      <div className="overflow-hidden rounded-2xl aspect-square" style={{ backgroundColor: 'var(--neutral-100)' }}>
        {video ? (
          <video
            ref={videoRef}
            src={video}
            muted
            autoPlay
            loop
            playsInline
            className="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
          />
        ) : (
          <img 
            src={img} 
            alt={brand} 
            className="w-full h-full object-cover transition-transform duration-700 hover:scale-105" 
          />
        )}
      </div>
      <div className="pt-5 pb-1 px-1">
        <span className="text-[10px] tracking-widest uppercase text-brand-greenLight font-semibold py-1 px-3 rounded-full" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border-color)' }}>

        <p className="text-sm" style={{ color: 'var(--text-secondary)' }}>{type}</p>
      </div>
    </div>
  );
};

// ==========================================
// 4. PROCESS RINGS COMPONENT (ambient 3D accent)
// ==========================================
const ProcessRings = () => {
  const mountRef = useRef(null);

  useEffect(() => {
    const canvas = mountRef.current;
    if (!canvas || typeof THREE === 'undefined') return;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(300, 300);

    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);
    const dir1 = new THREE.DirectionalLight(0xf5b04a, 1);
    dir1.position.set(2, 3, 4);
    scene.add(dir1);
    const dir2 = new THREE.DirectionalLight(0x7a6a50, 0.5);
    dir2.position.set(-3, -1, 2);
    scene.add(dir2);

    const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xe8a33d,
      roughness: 0.08,
      metalness: 0.1,
      transmission: 0.75,
      thickness: 1.0,
      ior: 1.5,
      clearcoat: 1,
      clearcoatRoughness: 0.05,
      transparent: true,
      opacity: 0.95,
    });
    const cube = new THREE.Mesh(geo, mat);
    cube.castShadow = true;

    const group = new THREE.Group();
    group.add(cube);
    scene.add(group);

    const ringConfigs = [
      { radius: 1.8, speed: 0.4, tiltX: Math.PI / 2.5, color: 0xf5b04a, emissiveIntensity: 2 },
      { radius: 2.2, speed: -0.25, tiltX: Math.PI / 1.8, color: 0xd4892a, emissiveIntensity: 1.4 },
      { radius: 2.6, speed: 0.15, tiltX: Math.PI / 3, color: 0xc77f2a, emissiveIntensity: 1 },
    ];

    ringConfigs.forEach((cfg) => {
      const rMat = new THREE.MeshStandardMaterial({
        color: cfg.color,
        emissive: cfg.color,
        emissiveIntensity: cfg.emissiveIntensity,
        transparent: true,
        opacity: 0.5,
        toneMapped: false,
      });
      const rGeo = new THREE.TorusGeometry(cfg.radius, 0.015, 16, 128);
      const ring = new THREE.Mesh(rGeo, rMat);
      group.add(ring);
      ring.userData = cfg;
    });

    let animId;
    const animate = () => {
      animId = requestAnimationFrame(animate);
      const t = performance.now() / 1000;

      group.rotation.x = Math.sin(t * 0.2) * 0.1;
      group.rotation.y = t * 0.3;

      cube.position.y = Math.sin(t * 0.6) * 0.15;

      group.children.forEach((child) => {
        if (child.isMesh && child !== cube && child.userData.radius) {
          const cfg = child.userData;
          child.rotation.z = t * cfg.speed;
          child.rotation.x = cfg.tiltX + Math.sin(t * 0.4) * 0.05;
        }
      });

      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(animId);
      geo.dispose();
      mat.dispose();
      renderer.dispose();
    };
  }, []);

  return (
    <canvas
      ref={mountRef}
      width={300}
      height={300}
      className="pointer-events-none"
      style={{ display: 'block' }}
    />
  );
};

// ==========================================
// 5. COVERFLOW CAROUSEL (adapted from Originkit)
// ==========================================

const { motion: cfMotion, useMotionValue, useTransform, useReducedMotion } = window.Motion;

function cfRelOf(index, pos, count) {
  let rel = (((index - pos) % count) + count) % count;
  if (rel > count / 2) rel -= count;
  return rel;
}

function cfXForRel(rel, s, gap) {
  const ar = Math.abs(rel);
  const c1 = s.activeWidth / 2 + gap + s.restWidth / 2;
  const pitch = s.restWidth + gap;
  const mag = ar <= 1 ? ar * c1 : c1 + (ar - 1) * pitch;
  return (rel < 0 ? -1 : 1) * mag;
}

function cfBlendForRel(rel) {
  return Math.min(Math.abs(rel), 1);
}

function CoverflowCard({
  item, index, pos, count, R, sizing, gap, radius, onSelect
}) {
  const src = item.img || "";
  const isVideo = !!item.video;

  const x = useTransform(pos, (p) => cfXForRel(cfRelOf(index, p, count), sizing, gap));
  const opacity = useTransform(pos, (p) => {
    const ar = Math.abs(cfRelOf(index, p, count));
    return ar <= R ? 1 : ar >= R + 1 ? 0 : 1 - (ar - R);
  });
  const zIndex = useTransform(pos, (p) => Math.round(1000 - Math.abs(cfRelOf(index, p, count)) * 100));
  const wVal = useTransform(pos, (p) => {
    const a = cfBlendForRel(cfRelOf(index, p, count));
    return sizing.activeWidth + (sizing.restWidth - sizing.activeWidth) * a;
  });
  const hVal = useTransform(pos, (p) => {
    const a = cfBlendForRel(cfRelOf(index, p, count));
    return sizing.activeHeight + (sizing.restHeight - sizing.activeHeight) * a;
  });
  const showText = useTransform(pos, (p) => Math.abs(cfRelOf(index, p, count)) < 0.8 ? 1 : 0);

  return React.createElement(
    cfMotion.div,
    {
      onClick: onSelect ? () => onSelect(index) : undefined,
      style: { position: "absolute", left: "50%", top: "50%", x, zIndex, opacity, cursor: onSelect ? "pointer" : "default" },
    },
    React.createElement(
      cfMotion.div,
      {
        style: {
          x: "-50%", y: "-50%", width: wVal, height: hVal, borderRadius: radius,
          overflow: "hidden", background: "var(--card-bg)", border: "1px solid var(--border-color)",
        },
      },
      React.createElement(
        "div", { style: { width: "100%", height: "100%", overflow: "hidden", position: "relative" } },
        isVideo
          ? React.createElement("video", { src: item.video, muted: true, autoPlay: true, loop: true, playsInline: true, style: { width: "100%", height: "100%", objectFit: "cover", display: "block", pointerEvents: "none", userSelect: "none" } })
          : React.createElement("img", { src: src, alt: item.brand || "", draggable: false, style: { width: "100%", height: "100%", objectFit: "cover", display: "block", pointerEvents: "none", userSelect: "none" } }),
        React.createElement(
          cfMotion.div,
          {
            style: {
              opacity: showText, position: "absolute", bottom: 0, left: 0, right: 0,
              padding: "16px", background: "linear-gradient(transparent, rgba(0,0,0,0.7))", pointerEvents: "none",
            },
          },
          React.createElement("span", { className: "text-[10px] tracking-widest uppercase font-semibold", style: { color: "#4D6D47", backgroundColor: "rgba(250,251,249,0.9)", border: "1px solid var(--border-color)", padding: "2px 10px", borderRadius: "9999px", display: "inline-block", marginBottom: "6px" } }, item.tag),
          React.createElement("h4", { style: { fontSize: "16px", fontWeight: 500, color: "#fff", margin: "4px 0 2px", textShadow: "0 1px 4px rgba(0,0,0,0.5)" } }, item.brand),
          React.createElement("p", { style: { fontSize: "12px", color: "rgba(255,255,255,0.8)", textShadow: "0 1px 3px rgba(0,0,0,0.4)" } }, item.type),
        )
      )
    )
  );
}

function CoverflowCarousel(props) {
  const {
    items: rawItems, activeWidth = 500, activeHeight = 360, restWidth = 140, restHeight = 210,
    gap = 24, radius = 12, showArrows = true, arrowColor = "#ffffff", arrowBackground = "rgba(0,0,0,0.6)",
    arrowSize = 48, autoplay = false, autoplayDirection = "rightToLeft", transitionDuration = 0.4,
    transitionDelay = 1.2, style,
  } = props;

  const prefersReducedMotion = useReducedMotion();
  const items = Array.isArray(rawItems) && rawItems.length > 0 ? rawItems : [];
  const count = Math.max(1, items.length);
  const sizing = { restWidth, restHeight, activeWidth, activeHeight };
  const R = Math.max(1, Math.min(6, Math.floor(count / 2) - 1));

  const pos = useMotionValue(0);
  const targetRef = useRef(0);
  const rafRef = useRef(null);
  const lastTRef = useRef(null);
  const autoplayingRef = useRef(false);
  const dirRef = useRef(1);
  const dwellAccRef = useRef(0);
  const moveDurRef = useRef(transitionDuration);
  moveDurRef.current = transitionDuration;
  const dwellRef = useRef(transitionDelay);
  dwellRef.current = transitionDelay;
  const reducedRef = useRef(prefersReducedMotion);
  reducedRef.current = prefersReducedMotion;

  const tick = useCallback((t) => {
    const last = lastTRef.current ?? t;
    const dt = Math.min((t - last) / 1000, 1 / 30);
    lastTRef.current = t;
    const cur = pos.get();
    const diff = targetRef.current - cur;
    const dur = Math.max(0.08, moveDurRef.current);
    const step = (1 / dur) * dt;
    const arriving = reducedRef.current || Math.abs(diff) <= step;
    if (arriving) {
      pos.set(targetRef.current);
      if (autoplayingRef.current) {
        dwellAccRef.current += dt;
        if (dwellAccRef.current >= Math.max(0, dwellRef.current)) {
          dwellAccRef.current = 0;
          targetRef.current += dirRef.current;
        }
        rafRef.current = requestAnimationFrame(tick);
        return;
      }
      rafRef.current = null;
      lastTRef.current = null;
      return;
    }
    pos.set(cur + Math.sign(diff) * step);
    rafRef.current = requestAnimationFrame(tick);
  }, [pos]);

  const ensureRunning = useCallback(() => {
    if (rafRef.current == null) {
      lastTRef.current = null;
      rafRef.current = requestAnimationFrame(tick);
    }
  }, [tick]);

  const goNext = useCallback(() => { targetRef.current += 1; ensureRunning(); }, [ensureRunning]);
  const goPrev = useCallback(() => { targetRef.current -= 1; ensureRunning(); }, [ensureRunning]);
  const goTo = useCallback((index) => {
    const cur = targetRef.current;
    let d = index - cur;
    d = ((d % count) + count) % count;
    if (d > count / 2) d -= count;
    targetRef.current = cur + d;
    ensureRunning();
  }, [ensureRunning, count]);

  useEffect(() => {
    return () => { if (rafRef.current != null) cancelAnimationFrame(rafRef.current); rafRef.current = null; };
  }, []);

  useEffect(() => {
    const on = autoplay && count > 1;
    autoplayingRef.current = on;
    if (on) {
      dirRef.current = autoplayDirection === "leftToRight" ? -1 : 1;
      dwellAccRef.current = 0;
      ensureRunning();
    }
    return () => { autoplayingRef.current = false; };
  }, [autoplay, autoplayDirection, count, ensureRunning]);

  const isHoveredRef = useRef(false);
  useEffect(() => {
    if (autoplay) return;
    const onKey = (e) => {
      if (!isHoveredRef.current) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); goNext(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [autoplay, goPrev, goNext]);

  const containerStyle = {
    ...style, position: "relative", width: "100%", height: "100%",
    minWidth: 320, minHeight: 300, overflow: "hidden", userSelect: "none", touchAction: "pan-y", outline: "none",
  };

  const selectable = !autoplay;
  const cards = items.map((item, i) =>
    React.createElement(CoverflowCard, {
      key: i, item, index: i, pos, count, R, sizing, gap, radius, onSelect: selectable ? goTo : undefined,
    })
  );

  const arrows = showArrows && count > 1 && (
    React.createElement(React.Fragment, null,
      React.createElement("button", {
        type: "button", "aria-label": "Previous",
        onPointerDown: (e) => e.stopPropagation(),
        onClick: (e) => { e.stopPropagation(); goPrev(); },
        style: {
          position: "absolute", top: "50%", left: "16px", transform: "translateY(-50%)",
          width: arrowSize, height: arrowSize, borderRadius: "50%", border: "none",
          background: arrowBackground, color: arrowColor, display: "flex", alignItems: "center",
          justifyContent: "center", cursor: "pointer", padding: 0, zIndex: 2000,
          boxShadow: "0 6px 18px rgba(0,0,0,0.35)", WebkitTapHighlightColor: "transparent",
        },
      }, React.createElement("svg", { width: arrowSize * 0.4, height: arrowSize * 0.4, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2.2, strokeLinecap: "round", strokeLinejoin: "round", style: { pointerEvents: "none" } },
        React.createElement("polyline", { points: "15 18 9 12 15 6" })
      )),
      React.createElement("button", {
        type: "button", "aria-label": "Next",
        onPointerDown: (e) => e.stopPropagation(),
        onClick: (e) => { e.stopPropagation(); goNext(); },
        style: {
          position: "absolute", top: "50%", right: "16px", transform: "translateY(-50%)",
          width: arrowSize, height: arrowSize, borderRadius: "50%", border: "none",
          background: arrowBackground, color: arrowColor, display: "flex", alignItems: "center",
          justifyContent: "center", cursor: "pointer", padding: 0, zIndex: 2000,
          boxShadow: "0 6px 18px rgba(0,0,0,0.35)", WebkitTapHighlightColor: "transparent",
        },
      }, React.createElement("svg", { width: arrowSize * 0.4, height: arrowSize * 0.4, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2.2, strokeLinecap: "round", strokeLinejoin: "round", style: { pointerEvents: "none" } },
        React.createElement("polyline", { points: "9 18 15 12 9 6" })
      ))
    )
  );

  return React.createElement("div", {
    tabIndex: 0,
    onMouseEnter: () => { isHoveredRef.current = true; },
    onMouseLeave: () => { isHoveredRef.current = false; },
    onFocus: () => { isHoveredRef.current = true; },
    onBlur: () => { isHoveredRef.current = false; },
    style: containerStyle,
  }, React.createElement("div", { style: { position: "absolute", inset: 0, overflow: "hidden", isolation: "isolate", zIndex: 0 } }, cards), arrows);
}

// 6. MAIN APP COMPONENT
// ==========================================
function App() {
  const [selectedServices, setSelectedServices] = useState([]);
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  const [activeTab, setActiveTab] = useState('video');
  const [hoveredCard, setHoveredCard] = useState(null);
  const [chatHoveredCard, setChatHoveredCard] = useState(null);
  const [showNav, setShowNav] = useState(true);
  const [theme, setTheme] = useState(() => localStorage.getItem('vizara-theme') || 'light');
  const lastScrollY = useRef(0);

  useEffect(() => {
    localStorage.setItem('vizara-theme', theme);
    document.documentElement.classList.toggle('dark', theme === 'dark');
  }, [theme]);

  const toggleTheme = () => setTheme(t => t === 'light' ? 'dark' : 'light');

                <span className="text-xs font-bold tracking-widest uppercase" style={{ color: 'var(--text-subtle)' }}>{plan.name}</span>
                <div className="text-4xl font-bold mt-4 mb-2" style={{ color: 'var(--text-primary)' }}>
                  {plan.price}<span className="text-sm font-normal" style={{ color: 'var(--text-subtle)' }}> {plan.unit}</span>
                </div>
                <p className="text-xs mb-6" style={{ color: 'var(--text-secondary)' }}>{plan.delivery} &middot; {plan.revisions}</p>
                <ul className="space-y-3 mb-8">
                  {plan.features.map((f, i) => (
                    <li key={i} className="text-sm flex items-start gap-2" style={{ color: 'var(--text-neutral-700)' }}>
                      <div className="w-1.5 h-1.5 rounded-full bg-brand-greenLight mt-1.5 shrink-0" /> {f}
                    </li>
                  ))}
                </ul>
              </div>
              <button
                onClick={() => document.getElementById('contact-anchor').scrollIntoView({behavior:'smooth'})}
                className={`w-full py-4 rounded-full text-sm font-medium uppercase tracking-wider transition-all duration-200 ${
                  chatHoveredCard === plan.name
                    ? 'bg-brand-green text-white shadow-md hover:bg-neutral-800'
                    : 'hover:border-neutral-400'
                }`}
                style={chatHoveredCard !== plan.name ? { border: '1px solid var(--border-color)', color: 'var(--text-primary)' } : {}}
              >
                {plan.cta}
              </button>
            </div>
          ))}
        </div>

        {/* Demo video embed slot */}
        <div className="max-w-2xl mx-auto rounded-3xl overflow-hidden" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border-color)' }}>
          <div className="aspect-video">
            <video
              src="/assets/chatbot-demo.mp4"
              autoPlay
              muted
              loop
              playsInline
              className="w-full h-full object-cover"
              style={{ display: 'block' }}
            />
          </div>
          <div className="p-6 text-center">
            <p className="text-sm" style={{ color: 'var(--text-secondary)' }}>
              See how a Vizara AI chatbot works live — instant answers, brand-matched, human handoff when needed.
            </p>
          </div>
        </div>
      </section>

      {/* CONTACT FORM SECTION */}
      <section id="contact-anchor" className="relative z-10 border-t py-24 px-6 sm:px-12 max-w-4xl mx-auto w-full" style={{ backgroundColor: 'var(--bg-primary)', borderColor: 'var(--border-color)' }}>
        <div className="rounded-[36px] p-8 md:p-16 text-center" style={{ backgroundColor: 'var(--bg-secondary)', border: '1px solid var(--border-color)' }}>
          <h2 className="text-4xl font-semibold tracking-tight mb-4" style={{ color: 'var(--text-primary)' }}>
            Ready to look <span className="italic font-serif text-brand-greenLight">expensive?</span>
          </h2>
          <p className="text-sm max-w-md mx-auto mb-10" style={{ color: 'var(--text-secondary)' }}>
            Submit your transmission below. We will render a free visual proof of your product — no contract required.
          </p>

          <form action="https://formspree.io/f/xykonbob" method="POST" className="flex flex-col gap-5 max-w-lg mx-auto">
            
            {/* hidden inputs for service pill integrations */}
            <input type="hidden" name="requested_services" value={selectedServices.join(', ')} />
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <input 
                type="text" 
                name="name" 
                placeholder="Your Name" 
                required 
                className="w-full rounded-full px-6 py-4 text-sm outline-none focus:border-brand-greenLight transition-colors"
                style={{ backgroundColor: 'var(--input-bg)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
              />
              <input 
                type="text" 
                name="contact" 
                placeholder="Email or WhatsApp" 
                required 
                className="w-full rounded-full px-6 py-4 text-sm outline-none focus:border-brand-greenLight transition-colors"
                style={{ backgroundColor: 'var(--input-bg)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
              />
            </div>
            
            <textarea 
              name="message" 
              placeholder="Describe your product, or highlight details about your query..." 
              required
              rows="4"
              className="w-full rounded-3xl px-6 py-4 text-sm outline-none resize-none focus:border-brand-greenLight transition-colors"
              style={{ backgroundColor: 'var(--input-bg)', border: '1px solid var(--border-color)', color: 'var(--text-primary)' }}
            />
            
            <button 
              type="submit" 
              className="w-full py-4 rounded-full bg-brand-green text-white hover:bg-neutral-800 transition-colors font-medium text-sm uppercase tracking-wider shadow-md"
            >
              Initiate Uplink
            </button>
          </form>
        </div>
      </section>

      {/* FOOTER */}
      <footer className="relative z-10 border-t py-12 px-6 sm:px-12 max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4" style={{ backgroundColor: 'var(--bg-primary)', borderColor: 'var(--border-color)' }}>
        <span className="text-lg font-semibold tracking-tight" style={{ color: 'var(--text-primary)' }}>Vizara Studio</span>
        <span className="text-xs" style={{ color: 'var(--text-subtle)' }}>&copy; 2026 Vizara Studio. All rights reserved. Created via Orbital Operations.</span>
      </footer>

    </div>
  );
}

// Render the application into #root
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script src="/chat-widget.js" data-api-url="https://vizara-support-agent.onrender.com/chat"></script>
</body>
</html>
